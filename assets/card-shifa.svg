<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-label="Al-Shifa Hospital">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#111c33"/></linearGradient>
  <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f472b6"/><stop offset="1" stop-color="#be185d"/></linearGradient>
  <radialGradient id="gl" cx="1" cy="0" r="1"><stop offset="0" stop-color="#f472b6" stop-opacity=".28"/><stop offset=".6" stop-color="#f472b6" stop-opacity="0"/></radialGradient>
  <clipPath id="c"><rect x="1" y="1" width="598" height="298" rx="20"/></clipPath>
</defs>
<style>
  .sheen { animation: sheen 6s ease-in-out infinite; }
  @keyframes sheen { 0%, 70% { transform: translateX(-260px) skewX(-20deg); } 100% { transform: translateX(800px) skewX(-20deg); } }
  .bar { animation: grow 1.2s cubic-bezier(.2,.7,.2,1) both; transform-origin: 0 0; }
  @keyframes grow { from { transform: scaleX(0); } }
  .pulse { animation: p 2s ease-in-out infinite; }
  @keyframes p { 50% { opacity: .35; } }
</style>
<g clip-path="url(#c)">
  <rect width="600" height="300" fill="url(#bg)"/>
  <rect width="600" height="300" fill="url(#gl)"/>
  <rect class="bar" width="600" height="5" fill="url(#ac)"/>
  <rect class="sheen" x="0" y="0" width="120" height="300" fill="#fff" opacity=".045"/>
</g>
<rect x="1" y="1" width="598" height="298" rx="20" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
<rect x="36" y="36" width="56" height="56" rx="16" fill="url(#ac)"/>
<text x="64" y="74" text-anchor="middle" font-size="28">🏥</text>
<text x="110" y="62" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="800" fill="#f8fafc">Al-Shifa Hospital</text>
<g transform="translate(110 74)"><circle class="pulse" cx="6" cy="9" r="4.5" fill="#22c55e"/><text x="18" y="14" font-family="'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="13" fill="#94a3b8">live demo</text></g>
<text x="36" y="136" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="16.5" fill="#cbd5e1">Responsive hospital website: services, doctors, news, and</text><text x="36" y="160" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="16.5" fill="#cbd5e1">sign-in and registration pages and a custom cursor.</text>
<g transform="translate(36 214)"><rect width="60" height="30" rx="15" fill="#f472b6" fill-opacity=".13" stroke="#f472b6" stroke-opacity=".45"/><text x="29.8" y="20" text-anchor="middle" font-family="'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="13" fill="#e2e8f0">HTML</text></g><g transform="translate(103.6 214)"><rect width="51" height="30" rx="15" fill="#f472b6" fill-opacity=".13" stroke="#f472b6" stroke-opacity=".45"/><text x="25.6" y="20" text-anchor="middle" font-family="'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="13" fill="#e2e8f0">CSS</text></g><g transform="translate(162.8 214)"><rect width="110" height="30" rx="15" fill="#f472b6" fill-opacity=".13" stroke="#f472b6" stroke-opacity=".45"/><text x="55.0" y="20" text-anchor="middle" font-family="'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="13" fill="#e2e8f0">JavaScript</text></g>
<text x="564" y="274" text-anchor="end" font-family="'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="13" fill="#f472b6">mo1amin.github.io/Shfa-H-  ↗</text>
</svg>